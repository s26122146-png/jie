<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <!-- Google Fonts 載入質感字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 全局變數與美拉德色系 (Maillard Color Palette) 定義
       您可以透過修改這裡的色碼來調整全站風格
       ========================================================================== */
    :root {
      --bg-main: #F4EBE1;          /* 燕麥奶油白 (背景色) */
      --bg-card: #FFFFFF;          /* 卡片背景白 */
      --text-dark: #3A2518;        /* 深焦糖/濃縮咖啡色 (主文字) */
      --text-muted: #8C6D58;       /* 淺褐/奶茶色 (次要文字、時間) */
      --accent-warm: #C86D3B;      /* 赤陶焦糖色 (強調色、按鈕、亮起外框) */
      --accent-glow: rgba(200, 109, 59, 0.35); /* 亮起時的發光顏色 */
      --card-border: #E5D5C5;      /* 預設邊框色 */
      --shadow-soft: 0 8px 24px rgba(58, 37, 24, 0.08); /* 柔和陰影 */
      
      /* 輪播控制參數 (註解輔助說明) */
      --carousel-duration: 3000ms;  /* 輪播切換時間 (毫秒) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      font-family: 'Poppins', 'Noto Serif TC', serif, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁首標題區 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* 主內容容器 */
    main {
      width: 100%;
      max-width: 1200px;
    }

    /* ==========================================================================
       2. 載入中酷炫動畫 (Loading Animation)
       ========================================================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--card-border);
      border-top: 4px solid var(--accent-warm);
      border-radius: 50%;
      animation: spin 1s linear infinite, pulseGlow 1.5s ease-in-out infinite alternate;
    }

    .loading-text {
      margin-top: 1.2rem;
      font-size: 1.1rem;
      color: var(--text-dark);
      font-weight: 600;
      letter-spacing: 1px;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 5px var(--accent-glow); }
      100% { box-shadow: 0 0 20px var(--accent-glow); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ==========================================================================
       3. 瀑布流排版 (Masonry Layout via CSS Column)
       ========================================================================== */
    .masonry-grid {
      /* 使用 CSS Column 實現高低錯落瀑布流 */
      column-count: 3;        /* 預設 3 欄 */
      column-gap: 1.5rem;      /* 欄位間距 */
      width: 100%;
      display: none;          /* 載入完成前先隱藏 */
    }

    /* 響應式斷點調整欄數 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* ==========================================================================
       4. 留言卡片樣式與動態輪播特效
       ========================================================================== */
    .card {
      break-inside: avoid;    /* 防止卡片從中間被斷開到下一欄 */
      margin-bottom: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      
      /* 轉場效果：讓視覺切換極其平滑 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform: scale(0.98);
      opacity: 0.7;
      filter: blur(1px);      /* 未選中的卡片微微模糊 */
    }

    /* 頂部裝飾條 (美拉德經典漸層色) */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #A85D32, #D99B6A);
      opacity: 0.3;
      transition: opacity 0.6s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .card-author {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author::before {
      content: '✦';
      color: var(--accent-warm);
      font-size: 0.8rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: sans-serif;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4A3528;
      white-space: pre-wrap;   /* 保留留言換行 */
      word-break: break-word;  /* 避免長字串撐開 */
    }

    /* --- 焦點/亮起卡片特效 (Highlight State) --- */
    .card.highlight {
      transform: scale(1.05);   /* 明顯放大 */
      opacity: 1;               /* 完全清晰 */
      filter: blur(0);          /* 取消模糊 */
      border-color: var(--accent-warm);
      box-shadow: 0 12px 32px var(--accent-glow), 0 0 15px rgba(200, 109, 59, 0.2);
      z-index: 10;
    }

    .card.highlight::before {
      opacity: 1;               /* 亮起頂部美拉德裝飾條 */
    }
  </style>
</head>
<body>

  <header>
    <h1>朋友對我的動態留言板</h1>
    <p>— 展覽微光 · 溫暖留痕 —</p>
  </header>

  <main>
    <!-- 載入中動畫區塊 -->
    <div id="loading-container">
      <div class="loader-spinner"></div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 瀑布流留言牆 -->
    <div id="masonry-wall" class="masonry-grid"></div>
  </main>

  <script>
    /* ==========================================================================
       5. JavaScript 邏輯控制
       ========================================================================== */

    // 【設定參數】
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSdM9nXZXei38Y7Qc76dv-CfsQH1bOTk2s7SnljrCGVDrjjkIXbpqGNTaCMDiGymdos0tXj-zpL9rC/pub?output=csv';
    
    // 【輪播秒數控制】改這裡可以調整切換間隔時間 (單位：毫秒，3000 = 3秒)
    const CAROUSEL_INTERVAL = 3000; 

    let messagesData = [];     // 儲存解析後的留言陣列
    let currentHighlightIndex = 0; // 當前輪播聚焦的索引
    let carouselTimer = null;  // 計時器物件

    // DOM 元素引用
    const loadingEl = document.getElementById('loading-container');
    const wallEl = document.getElementById('masonry-wall');

    /**
     * 健壯的 CSV 解析器
     * 正確處理留言內容中含有逗號 (,)、雙引號 (") 或換行符號的情形
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') { // 處理轉義雙引號 ""
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(current.trim());
          if (row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current !== '' || row.length > 0) {
        row.push(current.trim());
        lines.push(row);
      }
      return lines;
    }

    /**
     * 從 Google 試算表 CSV 網址取得資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路請求失敗');
        
        const csvText = await response.text();
        const rawRows = parseCSV(csvText);

        // 排除標題列 (時間戳記, 名字, 悄悄話)，並過濾空資料
        const dataRows = rawRows.slice(1);

        messagesData = dataRows.map(row => ({
          timestamp: row[0] || '未知時間',
          name: row[1] || '匿名朋友',
          content: row[2] || '（此留言無內容）'
        })).filter(msg => msg.name !== '匿名朋友' || msg.content !== '（此留言無內容）');

        // 渲染卡片至畫面上
        renderCards();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingEl.innerHTML = `
          <div style="color: var(--accent-warm); text-align:center;">
            <p>留言載入失敗，請稍後再試。</p>
            <small style="color: var(--text-muted);">${error.message}</small>
          </div>
        `;
      }
    }

    /**
     * 動態生成卡片並掛載到 DOM
     */
    function renderCards() {
      // 隱藏 Loading 動畫，顯示瀑布流容器
      loadingEl.style.display = 'none';
      wallEl.style.display = 'block';
      wallEl.innerHTML = '';

      if (messagesData.length === 0) {
        wallEl.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">目前還沒有任何留言喔！</p>';
        return;
      }

      // 動態建立卡片 DOM
      messagesData.forEach((msg, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(msg.name)}</span>
            <span class="card-time">${escapeHTML(formatTime(msg.timestamp))}</span>
          </div>
          <div class="card-content">${escapeHTML(msg.content)}</div>
        `;

        wallEl.appendChild(card);
      });

      // 開始啟動自動輪播特效
      startCarousel();
    }

    /**
     * 啟動與控制卡片輪播 (3 秒循環亮起)
     */
    function startCarousel() {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      // 立即執行第一次高亮
      updateHighlight(cards);

      // 設定計時器：依照 CAROUSEL_INTERVAL 時間輪播
      carouselTimer = setInterval(() => {
        currentHighlightIndex = (currentHighlightIndex + 1) % cards.length;
        updateHighlight(cards);
      }, CAROUSEL_INTERVAL);
    }

    /**
     * 切換卡片的高亮 (Highlight) 狀態
     */
    function updateHighlight(cards) {
      cards.forEach((card, index) => {
        if (index === currentHighlightIndex) {
          card.classList.add('highlight');
          
          // 可選：平滑滾動讓當前聚焦的卡片保持在視窗中間 (如不希望螢幕一直動可註解掉)
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    /**
     * XSS 安全防護：將特殊字元轉義
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * 簡單格式化時間字串
     */
    function formatTime(timeStr) {
      if (!timeStr) return '';
      // 若時間戳記過長，嘗試做簡易修飾，否則原樣輸出
      return timeStr.split(' ')[0] || timeStr;
    }

    // 頁面載入後自動啟動
    document.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
