<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁作品集入口</title>
    <style>
        /* 極簡深色背景與基礎設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #121214; /* 避開白色，採用極簡深灰 */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* 主容器 */
        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* 區塊 1：個人資訊（置中） */
        .profile {
            margin-bottom: 40px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            padding: 4px;
            background-color: #1e293b;
            transition: transform 0.5s ease;
        }

        /* 大頭貼小動畫：滑鼠移上去會輕微旋轉放大 */
        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 15px;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* 區塊 2：16 宮格按鈕選單（響應式排列） */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
        }

        /* 按鈕基礎樣式 */
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 已解鎖按鈕（Week 1 & Week 2） */
        .unlocked {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #3b82f6;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* 酷炫滑鼠懸停 (Hover) 效果 */
        .unlocked:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: #60a5fa;
            transform: translateY(-4px); /* 向上微浮 */
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); /* 霓虹發光 */
        }

        /* 未解鎖按鈕（灰色鎖定狀態） */
        .locked {
            background-color: #1e1e24;
            color: #475569;
            border: 1px solid #27272a;
            cursor: not-allowed; /* 顯示禁止點擊游標 */
            opacity: 0.6;
        }

        /* 未解鎖按鈕的 Hover 動畫：微微抖動或縮放提示未解鎖 */
        .locked:hover {
            transform: scale(0.98);
            background-color: #1a1a1f;
        }

        .emoji {
            margin-right: 8px;
            font-size: 1.1rem;
        }

        /* 手機板最佳化調整 */
        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr; /* 手機上一律單欄排列，更好點擊 */
            }
            .name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 畫面正中央的大頭貼與名字 -->
        <div class="profile">
            <!-- 預設假圖片，之後可換成你自己的照片 url -->
            <img class="avatar" src="https://picsum.photos" alt="大頭貼">

        <div class="menu-grid">
