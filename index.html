<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的網頁程式作品集</title>
<style>
:root {
--bg-color: #f7f5ef; /* 極簡淺色溫潤背景 (非純白) */
--card-bg: #ffffff;
--text-main: #2c3e50;
--text-muted: #8c9ba5;
--accent-color: #4a90e2;
--accent-gradient: linear-gradient(135deg, #6ba4e8, #4a90e2);
--locked-bg: #e2e8f0;
--locked-text: #94a3b8;
--shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.05);
--shadow-hover: 0 15px 35px rgba(74, 144, 226, 0.2);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 40px 20px;
}

.container {
width: 100%;
max-width: 900px;
display: flex;
flex-direction: column;
align-items: center;
}

/* 個人資訊區塊 (置中) */
.profile-section {
text-align: center;
margin-bottom: 50px;
animation: fadeInDown 0.8s ease-out;
}

.avatar-container {
width: 120px;
height: 120px;
border-radius: 50%;
overflow: hidden;
margin: 0 auto 20px;
box-shadow: var(--shadow-subtle);
border: 4px solid #ffffff;
transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.avatar-container:hover {
transform: scale(1.05) rotate(3deg);
}

.avatar-container img {
width: 100%;
height: 100%;
object-fit: cover;
}

.profile-name {
font-size: 1.8rem;
font-weight: 700;
letter-spacing: 1px;
margin-bottom: 8px;
color: var(--text-main);
}

.profile-subtitle {
font-size: 0.95rem;
color: var(--text-muted);
font-weight: 500;
}

/* 按鈕網格排版 (手機與電腦適應) */
.grid-container {
width: 100%;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
gap: 20px;
animation: fadeInUp 0.8s ease-out 0.2s both;
}

/* 按鈕基本樣式 */
.quest-btn {
background-color: var(--card-bg);
border-radius: 14px;
padding: 20px 15px;
text-align: center;
text-decoration: none;
color: var(--text-main);
font-weight: 600;
font-size: 0.95rem;
box-shadow: var(--shadow-subtle);
border: 1px solid rgba(0, 0, 0, 0.03);
transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 90px;
position: relative;
overflow: hidden;
}

/* 已解鎖按鈕的 Hover 動畫特效 */
.quest-btn.unlocked:hover {
transform: translateY(-5px);
box-shadow: var(--shadow-hover);
border-color: rgba(74, 144, 226, 0.4);
color: var(--accent-color);
}

.quest-btn.unlocked::after {
content: '';
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 3px;
background: var(--accent-gradient);
transform: scaleX(0);
transition: transform 0.3s ease;
}

.quest-btn.unlocked:hover::after {
transform: scaleX(1);
}

/* 未解鎖按鈕樣式 */
.quest-btn.locked {
background-color: var(--locked-bg);
color: var(--locked-text);
cursor: not-allowed;
box-shadow: none;
border: 1px dashed #cbd5e1;
}

.quest-btn.locked span {
font-size: 0.85rem;
margin-top: 4px;
}

/* 動畫定義 */
@keyframes fadeInDown {
from { opacity: 0; transform: translateY(-20px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}

/* 響應式微調 */
@media (max-width: 480px) {
.grid-container {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}
.profile-name {
font-size: 1.5rem;
}
}
</style>
</head>

<!-- 1. 畫面正中央大頭貼與名字 -->

<div class="avatar-container">
