<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端心電感應 (多人默契遊戲)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#F7F6F2',        // 暖米白背景
                            surface: '#EFECE6',   // 亞麻灰卡片
                            border: '#DFDBD2',    // 柔和細框線
                            text: '#3A3835',      // 炭灰主文字
                            muted: '#7A756E',     // 暖灰次要文字
                            sage: '#7A8B7E',      // 低飽和鼠尾草綠
                            haze: '#7E8E9B',      // 霧霾藍
                            clay: '#B58982',      // 陶土粉
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(58, 56, 53, 0.05)',
                        'card': '0 8px 24px -4px rgba(58, 56, 53, 0.08)',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom 3D & Minimalist CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: #F7F6F2;
            color: #3A3835;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 3D Card Flip Structure */
        .perspective-1000 {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-front-revealed {
            transform: rotateY(180deg);
        }

        /* Minimalist Geometric Back Pattern */
        .card-back-pattern {
            background-color: #EFECE6;
            background-image: radial-gradient(#D5D0C5 1px, transparent 1px);
            background-size: 14px 14px;
        }

        /* Subtle Drawer Transition */
        .drawer-transition {
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F6F2;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5D0C5;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7A8B7E;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-morandi-sage/20 selection:text-morandi-text">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 w-full bg-morandi-bg/90 backdrop-blur-md border-b border-morandi-border">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- Brand Title -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-morandi-surface border border-morandi-border flex items-center justify-center text-morandi-sage shadow-soft">
                    <i class="fa-solid fa-layer-group text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-morandi-text leading-none">
                        雲端心電感應
                    </h1>
                    <p class="text-[11px] text-morandi-muted mt-1 tracking-wide">多人默契連線試煉</p>
                </div>
            </div>

            <!-- Right Controls: Room Info, Sync Indicator & Secret Host Trigger -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Active Room Pill & Switch Button (Shown when in room) -->
                <div id="nav-room-controls" class="hidden items-center gap-2">
                    <button onclick="copyRoomLink()" title="複製房間邀請連結"
                        class="px-3 py-1.5 rounded-full bg-morandi-surface hover:bg-morandi-border/60 border border-morandi-border text-xs font-medium text-morandi-text flex items-center gap-1.5 transition">
                        <span class="text-morandi-muted">房號</span>
                        <span id="nav-room-code" class="font-bold tracking-wider">----</span>
                        <i class="fa-regular fa-copy text-morandi-muted text-[11px] ml-0.5"></i>
                    </button>

                    <button onclick="leaveRoom()" title="切換房間或更換暱稱"
                        class="px-2.5 py-1.5 rounded-full border border-morandi-border hover:bg-morandi-surface text-xs text-morandi-muted hover:text-morandi-text transition">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span class="hidden sm:inline ml-1">離開</span>
                    </button>
                </div>

                <!-- Polling Status Indicator -->
                <div id="sync-indicator" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-morandi-surface/70 border border-morandi-border/70 text-[11px] text-morandi-muted">
                    <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-morandi-sage"></span>
                    <span id="sync-text">待命中</span>
                </div>

                <!-- Discreet / Hidden Host Console Trigger -->
                <button id="secret-host-trigger" onclick="toggleHostConsole()" title="房主控制台 (快捷鍵 Alt+H)"
                    class="w-8 h-8 rounded-full flex items-center justify-center text-morandi-muted/40 hover:text-morandi-text hover:bg-morandi-surface transition duration-300 relative">
                    <i class="fa-solid fa-sliders text-xs"></i>
                    <span id="host-active-dot" class="hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-morandi-clay"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Toast Notification Area -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Main Container -->
    <main class="flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 py-8">

        <!-- ==========================================
             VIEW 1: ROOM LOBBY & LOGIN
        =========================================== -->
        <section id="lobby-view" class="max-w-md mx-auto my-4 sm:my-10">
            <div class="bg-white/70 backdrop-blur-sm border border-morandi-border rounded-3xl p-7 sm:p-9 shadow-soft">
                <div class="text-center mb-7">
                    <span class="inline-block px-3 py-1 rounded-full bg-morandi-surface text-morandi-muted text-[11px] font-medium tracking-wider mb-3">
                        TELEPATHY ROOM
                    </span>
                    <h2 class="text-2xl font-bold text-morandi-text tracking-tight">加入默契房間</h2>
                    <p class="text-xs sm:text-sm text-morandi-muted mt-1.5">輸入個人暱稱與房間代碼，與夥伴同步心靈頻率</p>
                </div>

                <form id="join-form" onsubmit="handleJoinRoom(event)" class="space-y-5">
                    <!-- Player Name -->
                    <div>
                        <label for="input-nickname" class="block text-xs font-medium text-morandi-text mb-1.5">玩家暱稱</label>
                        <input type="text" id="input-nickname" required maxlength="16" placeholder="輸入你的名字或代號"
                            class="w-full px-4 py-3 rounded-2xl bg-morandi-bg border border-morandi-border text-sm text-morandi-text placeholder-morandi-muted/60 focus:outline-none focus:border-morandi-sage focus:bg-white transition">
                    </div>

                    <!-- Room ID -->
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label for="input-room" class="block text-xs font-medium text-morandi-text">房間代碼 (Room ID)</label>
                            <button type="button" onclick="generateRoomCode()"
                                class="text-xs text-morandi-sage hover:text-morandi-text font-medium flex items-center gap-1 transition">
                                <i class="fa-solid fa-shuffle text-[11px]"></i> 隨機產生房號
                            </button>
                        </div>
                        <div class="relative flex items-center">
                            <input type="text" id="input-room" required maxlength="12" placeholder="例如：A102 或 8899"
                                class="w-full px-4 py-3 pr-11 rounded-2xl bg-morandi-bg border border-morandi-border text-sm font-semibold uppercase tracking-widest text-morandi-text placeholder-morandi-muted/60 focus:outline-none focus:border-morandi-sage focus:bg-white transition">
                            <button type="button" onclick="copyInputRoomCode()" title="複製房號"
                                class="absolute right-3 p-1.5 text-morandi-muted hover:text-morandi-text transition">
                                <i class="fa-regular fa-copy text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Optional Host Mode Check -->
                    <div class="pt-1">
                        <label class="inline-flex items-center gap-2.5 cursor-pointer select-none group">
                            <input type="checkbox" id="checkbox-host"
                                class="w-4 h-4 rounded border-morandi-border text-morandi-sage focus:ring-morandi-sage/40 bg-morandi-bg">
                            <span class="text-xs text-morandi-muted group-hover:text-morandi-text transition">我是本局房主（自動展開出題與開牌面板）</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full py-3.5 rounded-2xl bg-morandi-text hover:bg-morandi-text/90 text-morandi-bg text-sm font-medium tracking-wide shadow-soft transition flex items-center justify-center gap-2 mt-2">
                        <span>進入房間</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- ==========================================
             VIEW 2: ACTIVE GAME ROOM
        =========================================== -->
        <section id="game-view" class="hidden space-y-6">

            <!-- Collapsible Hidden Host Console Drawer -->
            <div id="host-console-drawer" class="hidden drawer-transition">
                <div class="bg-morandi-surface border border-morandi-border rounded-3xl p-5 sm:p-6 shadow-soft">
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-3.5 mb-4 border-b border-morandi-border">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-morandi-clay"></span>
                            <h3 class="text-sm font-bold text-morandi-text tracking-wide">房主控制台</h3>
                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-white/80 text-morandi-muted border border-morandi-border">Host Panel</span>
                        </div>
                        <button onclick="toggleHostConsole(false)" class="text-xs text-morandi-muted hover:text-morandi-text px-2 py-1 rounded-lg transition">
                            收合面板 <i class="fa-solid fa-chevron-up ml-1"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-end">
                        <!-- Set Question Input -->
                        <div class="lg:col-span-7">
                            <label for="host-question-field" class="block text-xs font-medium text-morandi-muted mb-1.5">發布新默契題目</label>
                            <div class="flex gap-2">
                                <input type="text" id="host-question-field" placeholder="輸入題目，例如：說到夏天會想到的食物？"
                                    class="flex-grow px-4 py-2.5 rounded-xl bg-white border border-morandi-border text-sm text-morandi-text placeholder-morandi-muted/60 focus:outline-none focus:border-morandi-sage transition">
                                <button onclick="handleHostSetQuestion()" id="btn-set-question"
                                    class="px-4 py-2.5 rounded-xl bg-morandi-sage hover:bg-morandi-sage/90 text-white text-xs sm:text-sm font-medium shrink-0 transition shadow-soft flex items-center gap-1.5">
                                    <i class="fa-solid fa-paper-plane text-xs"></i>
                                    <span>發布題目</span>
                                </button>
                            </div>
                        </div>

                        <!-- Reveal & Reset Actions -->
                        <div class="lg:col-span-5 flex gap-2.5">
                            <button onclick="handleHostReveal()" id="btn-reveal"
                                class="flex-1 py-2.5 px-4 rounded-xl bg-morandi-clay hover:bg-morandi-clay/90 text-white text-xs sm:text-sm font-medium transition shadow-soft flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                                <span>全體開牌</span>
                            </button>
                            <button onclick="handleHostReset()" id="btn-reset"
                                class="py-2.5 px-4 rounded-xl bg-white hover:bg-morandi-bg border border-morandi-border text-morandi-text text-xs sm:text-sm font-medium transition flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-rotate-left text-xs text-morandi-muted"></i>
                                <span>重置回合</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Question & Round Status Card -->
            <div class="bg-white/80 border border-morandi-border rounded-3xl p-6 sm:p-8 text-center shadow-soft relative">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-morandi-muted mb-4">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-1 rounded-full bg-morandi-surface text-morandi-text font-medium">
                            <i class="fa-regular fa-user mr-1 text-morandi-sage"></i>
                            <span id="display-player-name">--</span>
                        </span>
                    </div>
                    <div id="status-pill" class="px-3 py-1 rounded-full bg-morandi-surface text-morandi-muted font-medium">
                        等待房主出題
                    </div>
                </div>

                <!-- Topic Display -->
                <div class="py-3 max-w-2xl mx-auto">
                    <p class="text-[11px] uppercase tracking-widest text-morandi-muted mb-2">CURRENT TOPIC</p>
                    <h2 id="topic-display" class="text-xl sm:text-3xl font-bold text-morandi-text leading-snug min-h-[2.5rem] flex items-center justify-center">
                        <span class="text-morandi-muted/70 font-normal text-base sm:text-lg">等待房主出題中...</span>
                    </h2>
                </div>
            </div>

            <!-- Player Answer Input Area (Visible only in 'playing' state) -->
            <div id="player-answer-panel" class="hidden max-w-xl mx-auto">
                <div class="bg-morandi-surface/80 border border-morandi-border rounded-3xl p-5 sm:p-6 shadow-soft">
                    <div class="flex items-center justify-between mb-2.5">
                        <label for="input-player-answer" class="text-xs font-semibold text-morandi-text flex items-center gap-1.5">
                            <i class="fa-solid fa-pen-nib text-morandi-sage"></i>
                            <span>寫下你的心電感應答案</span>
                        </label>
                        <span id="answer-lock-badge" class="text-[11px] text-morandi-muted">尚未送出</span>
                    </div>

                    <form onsubmit="handlePlayerSubmitAnswer(event)" class="flex gap-2.5">
                        <input type="text" id="input-player-answer" maxlength="30" placeholder="輸入你的直覺答案..."
                            class="flex-grow px-4 py-3 rounded-2xl bg-white border border-morandi-border text-sm text-morandi-text placeholder-morandi-muted/60 focus:outline-none focus:border-morandi-sage transition">
                        <button type="submit" id="btn-submit-answer"
                            class="px-5 py-3 rounded-2xl bg-morandi-sage hover:bg-morandi-sage/90 text-white text-xs sm:text-sm font-medium shrink-0 shadow-soft transition flex items-center gap-1.5">
                            <i class="fa-solid fa-lock text-xs"></i>
                            <span>鎖定送出</span>
                        </button>
                    </form>
                    <p class="text-[11px] text-morandi-muted mt-2.5">
                        送出後卡牌將覆蓋並同步至答案牆；開牌前皆可重新修改並覆蓋送出。
                    </p>
                </div>
            </div>

            <!-- Match Analysis Banner (Shown when revealed & matches found) -->
            <div id="synergy-summary-box" class="hidden bg-morandi-sage/15 border border-morandi-sage/30 rounded-2xl p-4 sm:px-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-morandi-sage text-white flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-sparkles text-sm"></i>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-morandi-text">默契共振分析</h4>
                        <p id="synergy-summary-text" class="text-xs sm:text-sm text-morandi-text/90 mt-0.5">--</p>
                    </div>
                </div>
            </div>

            <!-- Multiplayer 3D Answer Cards Wall -->
            <div class="pt-2">
                <div class="flex items-center justify-between mb-4 px-1">
                    <h3 class="text-sm font-bold text-morandi-text flex items-center gap-2">
                        <span>玩家答案牆</span>
                        <span id="player-count-badge" class="px-2 py-0.5 rounded-full bg-morandi-surface border border-morandi-border text-xs font-medium text-morandi-muted">0 人已作答</span>
                    </h3>
                    <span class="text-xs text-morandi-muted" id="wall-hint-text">開牌後將同步翻轉揭曉</span>
                </div>

                <!-- Cards Grid -->
                <div id="cards-wall-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    <!-- Empty Placeholder -->
                    <div class="col-span-full py-14 text-center bg-white/40 border border-dashed border-morandi-border rounded-3xl text-morandi-muted text-xs sm:text-sm">
                        目前尚無玩家送出答案，等待大家連線作答中...
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Minimalist Footer -->
    <footer class="w-full py-5 text-center text-[11px] text-morandi-muted/80 border-t border-morandi-border/60">
        雲端心電感應 ‧ 極簡多人默契遊戲
    </footer>

    <!-- Vanilla JavaScript Logic -->
    <script>
        // ==========================================
        // 1. BACKEND GAS API CONSTANTS
        // ==========================================
        const SHEET_NAME = 'TelepathyData';
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzNg--O9F9tsCyCehAbiftckgMCIVelwv3j5C2zJLD04PtCiv4Xri-4dJgEtz9y9TrR/exec";
        const POLLING_INTERVAL_MS = 2500;

        // ==========================================
        // 2. APPLICATION STATE
        // ==========================================
        const appState = {
            room: "",
            playerName: "",
            isHostPanelOpen: false,
            pollingTimer: null,
            isFetching: false,
            // Remote state cache for diffing (prevents flickering)
            serverStatus: null,     // "setup" | "playing" | "revealed"
            serverQuestion: null,
            serverAnswersJson: "",
            localSubmittedAnswer: ""
        };

        // ==========================================
        // 3. INITIALIZATION & URL PARAMS
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            // Check URL parameter ?room=XXXX
            const params = new URLSearchParams(window.location.search);
            const roomFromUrl = params.get('room');
            if (roomFromUrl) {
                document.getElementById('input-room').value = roomFromUrl.trim().toUpperCase();
            }

            // Keyboard shortcut Alt+H to toggle hidden host console
            window.addEventListener('keydown', (e) => {
                if (e.altKey && (e.key === 'h' || e.key === 'H')) {
                    e.preventDefault();
                    toggleHostConsole();
                }
            });
        });

        // ==========================================
        // 4. LOBBY & ROOM MANAGEMENT
        // ==========================================
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('input-room').value = code;
            showToast(`已產生隨機房號：${code}`, 'sage');
        }

        function copyToClipboard(text, successMsg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMsg, 'sage');
                }).catch(() => fallbackCopy(text, successMsg));
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg, 'sage');
            } catch (err) {
                showToast('複製失敗，請手動選取複製', 'clay');
            }
            document.body.removeChild(textarea);
        }

        function copyInputRoomCode() {
            const val = document.getElementById('input-room').value.trim().toUpperCase();
            if (!val) {
                showToast('請先輸入或產生房間代碼', 'clay');
                return;
            }
            copyToClipboard(val, `已複製房號：${val}`);
        }

        function copyRoomLink() {
            if (!appState.room) return;
            const url = new URL(window.location.href);
            url.searchParams.set('room', appState.room);
            copyToClipboard(url.toString(), `已複製房間連結（房號 ${appState.room}）`);
        }

        function handleJoinRoom(event) {
            event.preventDefault();
            const nickname = document.getElementById('input-nickname').value.trim();
            const roomCode = document.getElementById('input-room').value.trim().toUpperCase();
            const openHost = document.getElementById('checkbox-host').checked;

            if (!nickname || !roomCode) {
                showToast('請填寫玩家暱稱與房間代碼', 'clay');
                return;
            }

            appState.playerName = nickname;
            appState.room = roomCode;
            appState.serverStatus = null;
            appState.serverQuestion = null;
            appState.serverAnswersJson = "";
            appState.localSubmittedAnswer = "";

            // Update URL without reloading
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomCode);
            window.history.replaceState({}, '', url);

            // Update Top Navbar & View
            document.getElementById('nav-room-code').textContent = roomCode;
            document.getElementById('nav-room-controls').classList.remove('hidden');
            document.getElementById('nav-room-controls').classList.add('flex');
            document.getElementById('sync-indicator').classList.remove('hidden');
            document.getElementById('display-player-name').textContent = nickname;

            document.getElementById('lobby-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');

            if (openHost) {
                toggleHostConsole(true);
            }

            showToast(`已進入房間 ${roomCode}`, 'sage');

            // Initial fetch & start polling
            pollRoomState();
            startPolling();
        }

        function leaveRoom() {
            stopPolling();
            appState.room = "";
            appState.serverStatus = null;
            appState.serverAnswersJson = "";

            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('lobby-view').classList.remove('hidden');
            document.getElementById('nav-room-controls').classList.add('hidden');
            document.getElementById('nav-room-controls').classList.remove('flex');
            document.getElementById('sync-indicator').classList.add('hidden');
            toggleHostConsole(false);
        }

        function toggleHostConsole(forceState) {
            const drawer = document.getElementById('host-console-drawer');
            const dot = document.getElementById('host-active-dot');
            const nextState = typeof forceState === 'boolean' ? forceState : drawer.classList.contains('hidden');

            appState.isHostPanelOpen = nextState;
            if (nextState) {
                drawer.classList.remove('hidden');
                dot.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
                dot.classList.add('hidden');
            }
        }

        // ==========================================
        // 5. GAS API COMMUNICATION (GET & POST)
        // ==========================================
        function startPolling() {
            stopPolling();
            appState.pollingTimer = setInterval(pollRoomState, POLLING_INTERVAL_MS);
        }

        function stopPolling() {
            if (appState.pollingTimer) {
                clearInterval(appState.pollingTimer);
                appState.pollingTimer = null;
            }
        }

        function setSyncIndicator(state) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            if (!dot || !text) return;

            if (state === 'syncing') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-morandi-haze animate-ping';
                text.textContent = '同步中...';
            } else if (state === 'ok') {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-morandi-sage';
                text.textContent = '已同步';
            } else {
                dot.className = 'w-1.5 h-1.5 rounded-full bg-morandi-clay';
                text.textContent = '連線異常';
            }
        }

        async function pollRoomState() {
            if (!appState.room || appState.isFetching) return;
            appState.isFetching = true;
            setSyncIndicator('syncing');

            try {
                const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(appState.room)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                setSyncIndicator('ok');
                reconcileRoomState(data);
            } catch (error) {
                console.error('Polling failed:', error);
                setSyncIndicator('error');
            } finally {
                appState.isFetching = false;
            }
        }

        async function postRoomAction(payload) {
            setSyncIndicator('syncing');
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        room: appState.room,
                        ...payload
                    })
                });
                const result = await response.json();
                if (result && result.success) {
                    await pollRoomState();
                    return true;
                } else {
                    showToast('伺服器回應異常，請重試', 'clay');
                    return false;
                }
            } catch (error) {
                console.error('POST action failed:', error);
                setSyncIndicator('error');
                showToast('網路連線失敗，請檢查網路狀態', 'clay');
                return false;
            }
        }

        // ==========================================
        // 6. HOST & PLAYER ACTIONS
        // ==========================================
        async function handleHostSetQuestion() {
            const input = document.getElementById('host-question-field');
            const question = input.value.trim();
            if (!question) {
                showToast('請先輸入要發布的題目', 'clay');
                input.focus();
                return;
            }

            const btn = document.getElementById('btn-set-question');
            btn.disabled = true;
            btn.classList.add('opacity-60');

            const ok = await postRoomAction({
                action: 'set_question',
                question: question
            });

            btn.disabled = false;
            btn.classList.remove('opacity-60');

            if (ok) {
                showToast('新題目已發布，開始作答！', 'sage');
            }
        }

        async function handleHostReveal() {
            const btn = document.getElementById('btn-reveal');
            btn.disabled = true;
            btn.classList.add('opacity-60');

            const ok = await postRoomAction({
                action: 'reveal'
            });

            btn.disabled = false;
            btn.classList.remove('opacity-60');

            if (ok) {
                showToast('已觸發全體開牌！', 'sage');
            }
        }

        async function handleHostReset() {
            const btn = document.getElementById('btn-reset');
            btn.disabled = true;
            btn.classList.add('opacity-60');

            const ok = await postRoomAction({
                action: 'reset'
            });

            btn.disabled = false;
            btn.classList.remove('opacity-60');

            if (ok) {
                document.getElementById('host-question-field').value = '';
                document.getElementById('input-player-answer').value = '';
                appState.localSubmittedAnswer = '';
                showToast('已重置本回合狀態', 'haze');
            }
        }

        async function handlePlayerSubmitAnswer(event) {
            event.preventDefault();
            const input = document.getElementById('input-player-answer');
            const answer = input.value.trim();
            if (!answer) {
                showToast('請輸入答案後再送出', 'clay');
                input.focus();
                return;
            }

            const btn = document.getElementById('btn-submit-answer');
            btn.disabled = true;
            btn.classList.add('opacity-60');

            const ok = await postRoomAction({
                action: 'submit_answer',
                playerName: appState.playerName,
                answer: answer
            });

            btn.disabled = false;
            btn.classList.remove('opacity-60');

            if (ok) {
                appState.localSubmittedAnswer = answer;
                updateLockBadge(answer);
                showToast('答案已鎖定並覆蓋卡牌', 'sage');
            }
        }

        function updateLockBadge(answerText) {
            const badge = document.getElementById('answer-lock-badge');
            if (answerText) {
                badge.innerHTML = `<span class="text-morandi-sage font-medium"><i class="fa-solid fa-check mr-1"></i>已鎖定：${escapeHtml(answerText)}</span>`;
            } else {
                badge.textContent = '尚未送出';
            }
        }

        // ==========================================
        // 7. FLICKER-FREE DOM RECONCILIATION & 3D FLIP
        // ==========================================
        function reconcileRoomState(data) {
            const status = data.status || 'setup';
            const question = data.question || '';
            const answers = data.answers || {};
            const answersJson = JSON.stringify(answers);

            const prevStatus = appState.serverStatus;
            const statusChanged = prevStatus !== status;
            const questionChanged = appState.serverQuestion !== question;
            const answersChanged = appState.serverAnswersJson !== answersJson;

            // Update cached state
            appState.serverStatus = status;
            appState.serverQuestion = question;
            appState.serverAnswersJson = answersJson;

            // A. Update Status Banner & Answer Input Visibility
            if (statusChanged || questionChanged) {
                renderTopicAndStatus(status, question);
            }

            // Sync player's own submitted badge from server if available
            if (answers[appState.playerName]) {
                updateLockBadge(answers[appState.playerName]);
            } else if (status === 'setup' || statusChanged && status === 'playing') {
                updateLockBadge('');
                if (status === 'setup') {
                    document.getElementById('input-player-answer').value = '';
                }
            }

            // B. Render or Flip Cards Wall
            if (answersChanged) {
                // Rebuild cards when player list or answers change
                renderCardsWall(answers, status === 'revealed');
            } else if (statusChanged) {
                // Smoothly toggle .is-flipped class on existing cards without destroying DOM!
                const shouldFlip = (status === 'revealed');
                document.querySelectorAll('.card-inner').forEach((cardEl) => {
                    if (shouldFlip) {
                        cardEl.classList.add('is-flipped');
                    } else {
                        cardEl.classList.remove('is-flipped');
                    }
                });
                // Re-apply match highlights when revealed
                if (shouldFlip) {
                    renderCardsWall(answers, true);
                }
            }

            // C. Update Synergy Analysis Summary
            if (status === 'revealed') {
                renderSynergySummary(answers);
            } else {
                document.getElementById('synergy-summary-box').classList.add('hidden');
            }
        }

        function renderTopicAndStatus(status, question) {
            const topicEl = document.getElementById('topic-display');
            const statusPill = document.getElementById('status-pill');
            const answerPanel = document.getElementById('player-answer-panel');
            const wallHint = document.getElementById('wall-hint-text');

            if (status === 'setup') {
                topicEl.innerHTML = `<span class="text-morandi-muted/70 font-normal text-base sm:text-lg">等待房主出題中...</span>`;
                statusPill.textContent = '準備階段 ‧ 等待出題';
                statusPill.className = 'px-3 py-1 rounded-full bg-morandi-surface text-morandi-muted font-medium';
                answerPanel.classList.add('hidden');
                wallHint.textContent = '新回合準備中';
            } else if (status === 'playing') {
                topicEl.textContent = question || '（未設定題目）';
                statusPill.textContent = '作答中 ‧ 請填寫答案';
                statusPill.className = 'px-3 py-1 rounded-full bg-morandi-sage/20 text-morandi-sage font-semibold';
                answerPanel.classList.remove('hidden');
                wallHint.textContent = '卡牌已覆蓋，等待房主開牌';
            } else if (status === 'revealed') {
                topicEl.textContent = question || '（未設定題目）';
                statusPill.textContent = '已開牌 ‧ 默契揭曉';
                statusPill.className = 'px-3 py-1 rounded-full bg-morandi-clay/20 text-morandi-clay font-semibold';
                answerPanel.classList.add('hidden');
                wallHint.textContent = '全體卡牌已翻轉揭曉';
            }
        }

        function renderCardsWall(answers, isRevealed) {
            const grid = document.getElementById('cards-wall-grid');
            const players = Object.keys(answers);
            document.getElementById('player-count-badge').textContent = `${players.length} 人已作答`;

            if (players.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-14 text-center bg-white/40 border border-dashed border-morandi-border rounded-3xl text-morandi-muted text-xs sm:text-sm">
                        目前尚無玩家送出答案，等待大家連線作答中...
                    </div>
                `;
                return;
            }

            // Calculate duplicate answers for highlighting matched groups when revealed
            const normalizedCounts = {};
            players.forEach((p) => {
                const norm = String(answers[p] || '').trim().toLowerCase();
                if (norm) {
                    normalizedCounts[norm] = (normalizedCounts[norm] || 0) + 1;
                }
            });

            grid.innerHTML = '';

            players.forEach((pName) => {
                const rawAns = String(answers[pName] || '');
                const normAns = rawAns.trim().toLowerCase();
                const isMatched = isRevealed && normAns && normalizedCounts[normAns] > 1;
                const isMe = pName === appState.playerName;

                const wrapper = document.createElement('div');
                wrapper.className = 'perspective-1000 h-44 sm:h-48 w-full';

                const frontBorderClass = isMatched
                    ? 'border-morandi-sage ring-2 ring-morandi-sage/30 bg-white'
                    : 'border-morandi-border bg-white';

                const matchTagHtml = isMatched
                    ? `<span class="px-2 py-0.5 rounded-full bg-morandi-sage/20 text-morandi-sage text-[10px] font-semibold">默契一致</span>`
                    : `<span class="text-[10px] text-morandi-muted">已揭曉</span>`;

                wrapper.innerHTML = `
                    <div class="card-inner ${isRevealed ? 'is-flipped' : ''}">
                        <!-- CARD BACK (Covered / Ready State) -->
                        <div class="card-face card-back-pattern rounded-3xl border border-morandi-border p-4 flex flex-col justify-between shadow-card">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-xs font-bold text-morandi-text truncate">
                                    ${escapeHtml(pName)}${isMe ? ' (我)' : ''}
                                </span>
                                <span class="w-2 h-2 rounded-full bg-morandi-sage shrink-0"></span>
                            </div>

                            <div class="my-auto flex flex-col items-center justify-center text-center">
                                <div class="w-10 h-10 rounded-2xl bg-white/90 border border-morandi-border flex items-center justify-center text-morandi-sage shadow-soft mb-2">
                                    <i class="fa-solid fa-check text-sm"></i>
                                </div>
                                <span class="text-xs font-medium text-morandi-text">已覆蓋卡牌</span>
                                <span class="text-[10px] text-morandi-muted mt-0.5">就緒等待開牌</span>
                            </div>

                            <div class="text-[10px] text-morandi-muted/70 text-center tracking-widest uppercase">
                                READY
                            </div>
                        </div>

                        <!-- CARD FRONT (Revealed Answer State) -->
                        <div class="card-face card-front-revealed rounded-3xl border ${frontBorderClass} p-4 flex flex-col justify-between shadow-card">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-xs font-semibold text-morandi-muted truncate">
                                    ${escapeHtml(pName)}${isMe ? ' (我)' : ''}
                                </span>
                                ${matchTagHtml}
                            </div>

                            <div class="my-auto px-1 text-center">
                                <p class="text-lg sm:text-xl font-bold text-morandi-text break-words leading-snug">
                                    ${escapeHtml(rawAns)}
                                </p>
                            </div>

                            <div class="flex justify-center">
                                <span class="w-6 h-1 rounded-full ${isMatched ? 'bg-morandi-sage' : 'bg-morandi-border'}"></span>
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(wrapper);
            });
        }

        function renderSynergySummary(answers) {
            const box = document.getElementById('synergy-summary-box');
            const textEl = document.getElementById('synergy-summary-text');
            const values = Object.values(answers).map(v => String(v || '').trim()).filter(Boolean);

            if (values.length < 2) {
                box.classList.add('hidden');
                return;
            }

            const counts = {};
            const displayMap = {};
            values.forEach((v) => {
                const key = v.toLowerCase();
                counts[key] = (counts[key] || 0) + 1;
                if (!displayMap[key]) displayMap[key] = v;
            });

            let bestKey = '';
            let bestCount = 0;
            for (const [k, c] of Object.entries(counts)) {
                if (c > bestCount) {
                    bestCount = c;
                    bestKey = k;
                }
            }

            box.classList.remove('hidden');
            if (bestCount > 1) {
                const pct = Math.round((bestCount / values.length) * 100);
                textEl.innerHTML = `共有 <strong>${bestCount}</strong> 位玩家寫出「<strong class="text-morandi-sage">${escapeHtml(displayMap[bestKey])}</strong>」，最高默契共振率為 <strong>${pct}%</strong>！`;
            } else {
                textEl.textContent = '本回合大家的想法各自獨特，沒有重複的答案！';
            }
        }

        // ==========================================
        // 8. UTILITIES (TOAST & XSS ESCAPE)
        // ==========================================
        function showToast(message, tone = 'sage') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let dotColor = 'bg-morandi-sage';
            if (tone === 'clay') dotColor = 'bg-morandi-clay';
            if (tone === 'haze') dotColor = 'bg-morandi-haze';

            toast.className = 'pointer-events-auto bg-white border border-morandi-border text-morandi-text px-4 py-3 rounded-2xl shadow-card text-xs sm:text-sm font-medium flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 opacity-0';
            toast.innerHTML = `
                <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                <span>${escapeHtml(message)}</span>
            `;

            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
